name: 发布 AWDP07 Open WebUI GHCR 镜像

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "integrations/upstream/build-open-webui-116.sh"
      - "integrations/upstream/Dockerfile.open-webui-labels"
      - ".github/workflows/publish-awdp07-image.yml"
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        env:
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dvlaa-open-webui:v0.1.116"
          chmod +x integrations/upstream/build-open-webui-116.sh
          integrations/upstream/build-open-webui-116.sh "$image"
          docker push "$image"